<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zingers</title>
<meta name="description" content="A quick-wit party game. One screen hosts, everyone plays on their phone. No accounts, no installs.">
<meta name="theme-color" content="#E8356F">
<meta property="og:title" content="Zingers">
<meta property="og:description" content="A quick-wit party game. One screen hosts, everyone plays on their phone.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23E8356F'/%3E%3Cpath d='M18 16h28v7L28 41h18v7H18v-7l18-18H18z' fill='%23FFE9C7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFE9C7; --bg2:#FFD99A; --card:#FFFFFF; --text:#2B0F3A; --muted:#6B4A7A;
  --x:#FFC83D; --y:#22C7B8; --pink:#E8356F; --ink:#2B0F3A; --line:#2B0F3A;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2B0F3A; --bg2:#45185C; --card:#3A1450; --text:#FFF3D1; --muted:#CDB7D9;
    --pink:#FF4F8B; --line:#FFC83D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#2B0F3A; --bg2:#45185C; --card:#3A1450; --text:#FFF3D1; --muted:#CDB7D9;
  --pink:#FF4F8B; --line:#FFC83D; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*,*::before,*::after{box-sizing:inherit}
body{background:radial-gradient(ellipse at 50% -10%, var(--bg2), var(--bg) 60%);background-color:var(--bg);color:var(--text);font:400 18px/1.45 Rubik, system-ui, -apple-system, "Segoe UI", sans-serif}
#app{min-height:100%;display:flex;flex-direction:column}
h1,h2,.logo,.bigcode,.marquee,.huge,.vs,.rank{font-family:Bungee, Impact, "Arial Black", sans-serif;font-weight:400;letter-spacing:.01em}
button{font:600 1rem/1.2 Rubik, system-ui, sans-serif;border:3px solid var(--line);border-radius:14px;padding:.8em 1.2em;cursor:pointer;background:var(--card);color:var(--text)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--pink);color:#fff;border-color:var(--pink)}
.big{font-size:1.25rem;padding:.9em 1.6em}
.ghost{background:transparent}
.small{font-size:.85rem;padding:.45em .8em;border-width:2px}
input,select,textarea{font:400 1.1rem Rubik, system-ui, sans-serif;width:100%;padding:.7em .8em;border:3px solid var(--line);border-radius:12px;background:var(--card);color:var(--text)}
textarea{font-size:1rem;min-height:5.5em;resize:vertical}
label{display:block;font-weight:600;margin:.9em 0 .35em}
details{margin-top:.9em}
summary{cursor:pointer;font-weight:600}
.muted{color:var(--muted)}
.warn{background:var(--pink);color:#fff;padding:.6em 1em;border-radius:10px;margin:0 auto;max-width:60ch}

/* home */
.home{max-width:980px;margin:0 auto;padding:clamp(16px,4vw,40px);width:100%}
.home h1{font-size:clamp(2.8rem,9vw,5.5rem);line-height:.95;margin:.2em 0 .1em;color:var(--pink);text-shadow:4px 4px 0 var(--line)}
.home .tag{font-size:1.15rem;max-width:46ch;margin:0 0 1.6em}
.panes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.pane{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:22px}
.pane h2{margin:0 0 .2em;font-size:1.5rem}
.pane > button{width:100%;margin-top:1.1em}
.fine{font-size:.9rem;margin-top:1.6em;max-width:70ch}

/* host */
.host{flex:1;display:flex;flex-direction:column;padding:clamp(12px,2.5vw,32px);gap:12px}
.hbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-size:1.6rem;color:var(--pink)}
.langfix{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:16px;z-index:5}
.langbtn{min-width:3.2em;font-weight:800;letter-spacing:.06em}
.chips .bot{display:inline-flex;align-items:center;gap:.4em}
.bottag{font-size:.7rem;font-weight:800;letter-spacing:.08em;background:var(--c);color:var(--ink);border-radius:6px;padding:.1em .4em}
.chipx{border:0;background:none;padding:0 .1em;font-size:1.2rem;line-height:1;color:var(--muted);cursor:pointer}
.linklike{background:none;border:0;padding:0;cursor:pointer;font-family:Bungee, Impact, sans-serif;font-weight:400;border-radius:8px}
.pbar .logo{font-size:1.05rem}
.resume{border-color:var(--pink);margin:0 0 20px}
.resume p{margin:0 0 .7em}
.code{margin-left:auto;font-size:1.05rem}
.code b{font-family:Bungee, Impact, sans-serif;font-weight:400;font-size:1.5rem;letter-spacing:.12em}
.timer{font-family:Bungee, Impact, sans-serif;font-size:1.9rem;min-width:2.4em;text-align:center;background:var(--text);color:var(--bg);border-radius:12px;padding:.05em .3em}
.timer:empty{visibility:hidden}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;max-width:1300px;width:100%;margin:0 auto}
.joinbox{display:flex;align-items:center;justify-content:center;gap:clamp(16px,4vw,48px);flex-wrap:wrap}
.qr{background:#fff;border:4px solid var(--line);border-radius:18px;padding:10px;width:clamp(150px,20vw,230px);height:auto;display:block}
.bigcode{font-size:clamp(4rem,16vw,11rem);line-height:1;letter-spacing:.14em;color:var(--pink);text-shadow:6px 6px 0 var(--line)}
.url{font-weight:800;word-break:break-all}
.lead{font-size:1.4rem;margin:0}
.huge{font-size:clamp(2.2rem,7vw,5.5rem);line-height:1;margin:0}
.chips,.status{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.chips li,.status li{border:3px solid var(--c,var(--line));border-radius:999px;padding:.35em 1em;font-weight:800;font-size:1.2rem;background:var(--card)}
.status li{opacity:.55}
.status li.done{opacity:1;background:var(--c);color:var(--ink)}
.status li.gone{text-decoration:line-through}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.marquee{font-size:clamp(1.5rem,3.6vw,3rem);line-height:1.15;padding:.7em 1em;border:8px dotted var(--x);border-radius:24px;background:var(--card);max-width:28ch}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:stretch;width:100%}
.vs{align-self:center;font-size:2rem;color:var(--pink)}
.ans{border-radius:22px;padding:24px;color:var(--ink);font-weight:800;font-size:clamp(1.3rem,3vw,2.4rem);line-height:1.2;display:flex;flex-direction:column;justify-content:center;gap:12px;min-height:180px;border:4px solid var(--ink)}
.ans.x{background:var(--x)} .ans.y{background:var(--y)}
.ans .who{font-size:1rem;font-weight:600}
.ans .pts{font-family:Bungee, Impact, sans-serif;font-weight:400;font-size:1.6rem}
.ans .votes{font-size:1.05rem;font-weight:700;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.ans .votes .vtag{background:var(--c);border:2px solid var(--ink);border-radius:999px;padding:.05em .6em;font-weight:800}
.ans.none{opacity:.6;font-style:italic}
.banner{font-family:Bungee, Impact, sans-serif;font-size:clamp(2rem,6vw,4.2rem);color:var(--pink);text-shadow:4px 4px 0 var(--line);margin:0}
@media (prefers-reduced-motion:no-preference){.banner{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:no-preference){
  .duel.rev .who{animation:pop .45s cubic-bezier(.2,1.4,.4,1) .8s both}
  .duel.rev .votes{animation:pop .45s cubic-bezier(.2,1.4,.4,1) 1.8s both}
  .duel.rev .pts{animation:pop .5s cubic-bezier(.2,1.6,.4,1) 2.8s both}
  .stage .banner.late{animation:pop .5s cubic-bezier(.2,1.6,.4,1) 2.8s both}
}
.ans .who .tag{display:inline-block;background:var(--c);color:var(--ink);border:4px solid var(--ink);border-radius:999px;padding:.12em .7em;font-family:Bungee, Impact, sans-serif;font-weight:400;font-size:clamp(1.3rem,2.6vw,2.2rem);line-height:1.15;box-shadow:4px 4px 0 var(--ink);transform:rotate(-2deg)}
.fgrid .ans .who .tag{font-size:clamp(1.1rem,2vw,1.6rem)}
.board li{position:relative;will-change:transform}
.board li.up{z-index:2;box-shadow:0 10px 28px rgba(0,0,0,.35)}
.board .gain{margin-left:auto;font-family:Bungee, Impact, sans-serif;font-weight:400;font-size:1rem;color:var(--c,var(--pink))}
@media (prefers-reduced-motion:no-preference){.board .gain{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}}
.board .gain + .sc{margin-left:0}
.tro{display:block;font-size:.72em;font-weight:600;opacity:.6;margin-top:.4em}
.sent{font-size:.9rem}
@media (prefers-reduced-motion:no-preference){.freveal .fgrid .ans{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(1.2s + var(--i,0) * .15s)}}
.board{list-style:none;padding:0;margin:0;width:min(640px,100%);display:flex;flex-direction:column;gap:10px}
.board li{display:flex;align-items:center;gap:14px;background:var(--card);border:3px solid var(--c,var(--line));border-radius:16px;padding:.55em 1em;font-size:1.35rem;font-weight:800}
.board .rank{font-size:1.3rem;min-width:1.6em}
.board .sc{margin-left:auto;font-family:Bungee, Impact, sans-serif;font-weight:400}
/* ---------- motion: entrances, pops, confetti (all off with reduced motion) ---------- */
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;opacity:.35;
  background:radial-gradient(closest-side,#FF4F8B,transparent) 10% 20%/34vmax 34vmax no-repeat,
             radial-gradient(closest-side,#FFC83D,transparent) 85% 30%/28vmax 28vmax no-repeat,
             radial-gradient(closest-side,#22C7B8,transparent) 40% 90%/30vmax 30vmax no-repeat}
#app{position:relative;z-index:0}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-4vh;width:.7em;height:1.1em;border-radius:2px;background:var(--c);animation:fall var(--d,3s) cubic-bezier(.25,.4,.5,1) var(--w,0s) both}
@keyframes fall{from{transform:translate3d(0,0,0) rotate(0)}to{transform:translate3d(var(--x,0),110vh,0) rotate(var(--r,720deg))}}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:none}}
@keyframes slam{0%{opacity:0;transform:scale(2.6) rotate(-6deg)}60%{opacity:1;transform:scale(.92) rotate(1deg)}100%{transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-90px) rotate(-4deg)}55%{opacity:1;transform:translateY(10px) rotate(1.5deg)}75%{transform:translateY(-4px)}100%{transform:none}}
@keyframes slideL{0%{opacity:0;transform:translateX(-60vw) rotate(-8deg)}70%{opacity:1;transform:translateX(12px) rotate(1deg)}100%{transform:none}}
@keyframes slideR{0%{opacity:0;transform:translateX(60vw) rotate(8deg)}70%{opacity:1;transform:translateX(-12px) rotate(-1deg)}100%{transform:none}}
@keyframes spinIn{from{opacity:0;transform:scale(0) rotate(-540deg)}to{opacity:1;transform:none}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25) rotate(-3deg)}100%{transform:scale(1)}}
@keyframes throb{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes winner{0%{transform:none}50%{transform:scale(1.08) rotate(-1deg)}100%{transform:scale(1.04)}}
@keyframes loser{to{opacity:.55;transform:scale(.95) rotate(1deg);filter:saturate(.6)}}
@keyframes drift{from{transform:translate3d(-3%,-2%,0) rotate(0)}to{transform:translate3d(3%,2%,0) rotate(8deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@media (prefers-reduced-motion:no-preference){
  body::before{animation:drift 22s ease-in-out infinite alternate}
  .stage.enter > *{animation:rise .5s cubic-bezier(.2,1.2,.4,1) both;animation-delay:calc(var(--k,0) * 110ms)}
  .stage.enter > .huge{animation:slam .65s cubic-bezier(.2,1.2,.4,1) both}
  .stage.enter > .marquee{animation:drop .75s cubic-bezier(.3,1.3,.5,1) both}
  .stage.enter .duel .ans.x{animation:slideL .7s cubic-bezier(.2,1,.4,1) .35s both}
  .stage.enter .duel .ans.y{animation:slideR .7s cubic-bezier(.2,1,.4,1) .55s both}
  .stage.enter .duel .vs{animation:spinIn .6s cubic-bezier(.2,1.4,.4,1) .9s both}
  .stage.enter > .duel{animation:none}
  .duel.rev .ans.win{animation:winner .7s cubic-bezier(.2,1.6,.4,1) 3s both;box-shadow:0 0 0 6px var(--line),0 18px 40px rgba(0,0,0,.3)}
  .duel.rev .ans.lose{animation:loser .7s ease 3s both}
  .chips li.pop,.status li.pop{animation:bump .55s cubic-bezier(.2,1.6,.4,1)}
  .timer.hurry{animation:throb .5s ease-in-out infinite;background:var(--pink);color:#fff}
  .vs{display:inline-block}
  .bigcode{animation:wiggle 4s ease-in-out infinite}
  .pstage.enter > *{animation:rise .45s cubic-bezier(.2,1.2,.4,1) both;animation-delay:calc(var(--k,0) * 90ms)}
  .pstage.enter > .pick.x{animation:slideL .55s cubic-bezier(.2,1,.4,1) both;animation-delay:calc(var(--k,0) * 90ms)}
  .pstage.enter > .pick.y{animation:slideR .55s cubic-bezier(.2,1,.4,1) both;animation-delay:calc(var(--k,0) * 90ms)}
  .pick:active{transform:scale(.97)}
}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;width:100%}
.fgrid .ans{min-height:120px;font-size:clamp(1.1rem,2.2vw,1.7rem)}
.fgrid .ans:nth-child(odd){background:var(--x)} .fgrid .ans:nth-child(even){background:var(--y)}
.num{font-family:Bungee, Impact, sans-serif;font-weight:400;font-size:1rem}

/* player */
.player{flex:1;display:flex;flex-direction:column;padding:16px;gap:14px;max-width:560px;margin:0 auto;width:100%}
.pbar{display:flex;align-items:center;gap:10px}
.pbar .me{font-weight:800;border:3px solid var(--c,var(--line));border-radius:999px;padding:.2em .8em}
.pbar .timer{margin-left:auto;font-size:1.3rem}
.pbar > .muted{white-space:nowrap;font-size:.9rem}
.pstage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
.pstage h2{font-size:1.6rem;margin:0;line-height:1.1}
.pprompt{font-size:1.4rem;font-weight:800;line-height:1.25;background:var(--card);border:3px dotted var(--line);border-radius:16px;padding:16px}
.pick{width:100%;text-align:left;font-size:1.25rem;font-weight:800;color:var(--ink);padding:1em;border-color:var(--ink);min-height:84px}
.pick.x{background:var(--x)} .pick.y{background:var(--y)}
.lost{font-size:.9rem;color:var(--pink);min-height:1.2em}
.count{font-size:.9rem}
@media (max-width:700px){.duel{grid-template-columns:1fr}.vs{justify-self:center}}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:20px">Zingers needs JavaScript.</p></noscript>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js" integrity="sha384-x0YgkOr/3UOZP2CRDxGW9e0Q+2Qjyr3uJrm4xU32Y7ZCNAo7Cc7bjhrZMi/dwczu" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.js" integrity="sha384-e9EFD6BGC90bkW9aDV5xbbBfzwN7G8YImHao2lfLVKV/hPB0E0go+H3I64h7oHtA" crossorigin="anonymous"></script>
<script src="prompts.js"></script>
<script src="i18n.js"></script>
<script src="ai-answers.js"></script>
<script src="sound.js"></script>
<script>
(function(){
"use strict";

/* ---------- helpers ---------- */
const app = document.getElementById("app");
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v===false || v==null) continue;
    if (k==="class") e.className = v;
    else if (k==="style") e.setAttribute("style", v);
    else if (k==="html") e.innerHTML = v;
    else if (k.startsWith("on") && typeof v==="function") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v===true ? "" : v);
  }
  for (const k of kids.flat(3)){
    if (k==null || k===false) continue;
    e.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  return e;
}
function mount(node){ document.documentElement.lang = lang(); app.replaceChildren(node); }
const calm = ()=>!!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
/* Play the entrance animation only when a new screen appears, not on every progress redraw. */
function enter(sel){ const st = app.querySelector(sel); if(!st) return; st.classList.add("enter"); [...st.children].forEach((c,i)=>c.style.setProperty("--k", i)); }
/* Pop newly finished or newly joined players once. */
function popNew(list, seen){ list.forEach(li=>{ const id = li.dataset.pid; if(id && !seen.has(id)){ seen.add(id); li.classList.add("pop"); } }); }
function confetti(n, delay){
  if(calm() || document.hidden) return;
  setTimeout(()=>{
    const box = h("div",{class:"confetti","aria-hidden":"true"});
    for(let i=0;i<n;i++){
      const e = h("i",{});
      e.style.cssText = "left:"+(Math.random()*100)+"vw;--c:"+COLORS[i%COLORS.length]+";--d:"+(2.4+Math.random()*2).toFixed(2)+"s;--w:"+(Math.random()*.6).toFixed(2)+"s;--x:"+((Math.random()-.5)*30).toFixed(1)+"vw;--r:"+Math.round((Math.random()-.5)*1440)+"deg;width:"+(6+Math.random()*8).toFixed(0)+"px";
      box.append(e);
    }
    document.body.append(box); setTimeout(()=>box.remove(), 5200);
  }, delay||0);
}
function clean(s, n){
  return String(s==null?"":s)
    .replace(/[\u0000-\u001f\u007f-\u009f\u00ad\u200b-\u200f\u2028-\u202e\u2060-\u206f\ufeff]/g,"")
    .replace(/\s+/g," ").trim().slice(0,n);
}
function rid(){ return (Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,8)).slice(0,14); }
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const LETTERS = "BCDFGHJKLMNPQRSTVWXZ";
function makeCode(){ let s=""; for(let i=0;i<4;i++) s+=LETTERS[Math.floor(Math.random()*LETTERS.length)]; return s; }
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
/* per-tab: survives a reload, but two tabs on one device are two players */
const tabStore = {
  get(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} }
};
/* timer that keeps running when the host tab is in the background */
function startTicker(fn){
  try{
    const w = new Worker(URL.createObjectURL(new Blob(["setInterval(function(){postMessage(0)},250)"],{type:"text/javascript"})));
    w.onmessage = fn; return;
  }catch(e){}
  setInterval(fn, 250);
}
const COLORS = ["#FF4F8B","#22C7B8","#FFC83D","#9B8CFF","#FF8A3D","#5ED36B","#4FB3FF","#F27BF2"];
const T = { answer:120000, vote:20000, reveal:13000, scores:11000, intro:4500, fanswer:100000, fvote:30000, freveal:18000 };
const BANK_EN = window.ZINGERS_PROMPTS || { clean:[], cheeky:[], finals:[] };
/* ---------- language ---------- */
const DICT = window.ZING_I18N || { en:{} };
const deviceLang = /^nl/i.test(navigator.language || "") ? "nl" : "en";
function lang(){
  const s = store.get("zing-lang"); if(s==="en" || s==="nl") return s;
  if(typeof P!=="undefined" && P.nr && P.st && (P.st.lg==="nl" || P.st.lg==="en")) return P.st.lg;   /* players follow the host until they pick */
  return deviceLang;
}
function t(k, ...a){
  let v = (DICT[lang()]||{})[k]; if(v==null) v = (DICT.en||{})[k]; if(v==null) return k;
  return typeof v==="function" ? v(...a) : v;
}
function bank(){ return lang()==="nl" && window.ZINGERS_PROMPTS_NL ? window.ZINGERS_PROMPTS_NL : BANK_EN; }
function langButton(){

function qrSvg(text){
  try{
    const q = qrcode(0,"M"); q.addData(text); q.make();
    const n = q.getModuleCount(); let d = "";
    for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) d += `M${c} ${r}h1v1h-1z`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 ${n+4} ${n+4}" class="qr" role="img" aria-label="QR code to join"><path d="${d}" fill="#2B0F3A"/></svg>`;
  }catch(e){ return ""; }
}

/* ======================================================================
   NETWORK: peer-to-peer rooms over WebRTC (PeerJS).
   The host screen is the server. Players connect straight to it.
   Same shape as the room API the game was written against:
   presence(), onPeers(), emit(), on().
   ====================================================================== */
const PEER_PREFIX = "zingers-v1-";
const PEER_OPTS = Object.assign({ debug:0 }, window.ZINGERS_PEER_OPTIONS || {}); /* optional: point at your own PeerServer */
const Net = {
  host(code){
    return new Promise((resolve, reject)=>{
      if(typeof Peer === "undefined") return reject({code:"no_network_lib"});
      const peer = new Peer(PEER_PREFIX+code.toLowerCase(), PEER_OPTS);
      const conns = new Map();           // connectionId -> {conn, presence}
      let peersCb = ()=>{}; let opened = false;
      const peers = ()=>[...conns.values()].filter(c=>c.presence).map(c=>({presence:c.presence}));
      const fire = (joined)=>{ try{ peersCb({ peers:peers(), joined: joined?[joined]:[] }); }catch(e){} };
      peer.on("open", ()=>{ opened = true; resolve(room); });
      peer.on("error", err=>{
        if(!opened) return reject({code: err && err.type === "unavailable-id" ? "taken" : (err && err.type) || "error"});
      });
      peer.on("disconnected", ()=>{ setTimeout(()=>{ try{ if(!peer.destroyed) peer.reconnect(); }catch(e){} }, 1500); });
      peer.on("connection", conn=>{
        const rec = { conn, presence:null };
        conns.set(conn.connectionId, rec);
        conn.on("data", msg=>{
          if(!msg || typeof msg!=="object") return;
          if(msg.t==="p" && msg.d && typeof msg.d==="object"){
            const first = !rec.presence;
            rec.presence = msg.d;
            fire(first ? rec : null);
          }
        });
        const drop = ()=>{ if(conns.delete(conn.connectionId)) fire(null); };
        conn.on("close", drop); conn.on("error", drop);
      });
      const room = {
        presence(){ return Promise.resolve(); },
        onPeers(cb){ peersCb = cb; },
        emit(name, data){
          const pkt = { t:"e", n:name, d:data };
          for(const {conn} of conns.values()){ if(conn.open){ try{ conn.send(pkt); }catch(e){} } }
          return Promise.resolve();
        },
        on(){},
        close(){ try{ peer.destroy(); }catch(e){} }
      };
    });
  },
  join(code, onStatus){
    return new Promise((resolve, reject)=>{
      if(typeof Peer === "undefined") return reject({code:"no_network_lib"});
      const hostId = PEER_PREFIX+code.toLowerCase();
      const peer = new Peer(PEER_OPTS);
      const handlers = {}; let pres = {}; let conn = null; let settled = false; let retry = null;
      const status = s=>{ try{ onStatus && onStatus(s); }catch(e){} };
      function connect(){
        clearTimeout(retry);
        if(peer.destroyed) return;
        if(peer.disconnected){ try{ peer.reconnect(); }catch(e){} retry = setTimeout(connect, 2000); return; }
        const c = peer.connect(hostId, { reliable:true, serialization:"json" });
        conn = c;
        const giveUp = setTimeout(()=>{ if(!c.open){ try{ c.close(); }catch(e){} if(settled) retry = setTimeout(connect, 1500); else { settled = true; reject({code:"timeout"}); } } }, 12000);
        c.on("open", ()=>{
          clearTimeout(giveUp);
          try{ c.send({t:"p", d:pres}); }catch(e){}
          status("up");
          if(!settled){ settled = true; resolve(room); }
        });
        c.on("data", msg=>{
          if(!msg || msg.t!=="e" || typeof msg.n!=="string") return;
          (handlers[msg.n]||[]).forEach(fn=>{ try{ fn({ data:msg.d, sameTab:false }); }catch(e){} });
        });
        c.on("close", ()=>{ if(conn===c && settled){ status("down"); retry = setTimeout(connect, 1500); } });
        c.on("error", ()=>{});
      }
      peer.on("open", connect);
      peer.on("error", err=>{
        const t = err && err.type;
        if(t==="peer-unavailable"){
          if(!settled){ settled = true; reject({code:"no_room"}); }
          else { status("down"); retry = setTimeout(connect, 3000); }
        } else if(!settled && ["browser-incompatible","ssl-unavailable","server-error","socket-error","network"].includes(t)){
          settled = true; reject({code:t});
        }
      });
      peer.on("disconnected", ()=>{ setTimeout(()=>{ try{ if(!peer.destroyed) peer.reconnect(); }catch(e){} }, 1500); });
      document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && settled && (!conn || !conn.open)) connect(); });
      const room = {
        presence(p){
          pres = { ...pres, ...p };
          if(conn && conn.open){ try{ conn.send({t:"p", d:pres}); }catch(e){} }
          return Promise.resolve();
        },
        onPeers(){},
        emit(){ return Promise.resolve(); },
        on(name, fn){ (handlers[name] = handlers[name]||[]).push(fn); },
        close(){ try{ peer.destroy(); }catch(e){} }
      };
    });
  }
};
function netError(code){
  const k = "err_"+code; const v = t(k);
  return v===k ? t("errGeneric", code) : v;
}

const Snd = window.ZingSound || { init(){}, startMusic(){}, stopMusic(){}, phase(){}, sfx(){}, isMuted(){ return true; }, toggle(){ return true; } };
document.addEventListener("pointerdown", ()=>{ if(H.nr) Snd.init(); }, true);
function progressSound(){
  const G = H.G; if(!G) return;
  let k = "", n = 0, kind = "";
  if(G.phase==="lobby"){ k = "lobby"; n = lobbyPlayers().length; kind = "join"; }
  else if(G.phase==="answer"){ k = G.rk; n = G.players.reduce((a,p)=>a+answeredCount(p.pid),0); kind = "pop"; }
  else if(G.phase==="vote" && cur()){ k = G.vk; n = votedPids().length; kind = "tick"; }
  else if(G.phase==="fanswer"){ k = G.final.fk; n = G.players.filter(p=>ansOf(p.pid,G.final.fk,"f")).length; kind = "pop"; }
  else if(G.phase==="fvote"){ k = G.final.fk+"v"; n = G.players.filter(p=>finalVote(p.pid)).length; kind = "tick"; }
  if(k && k===H.sndK && n>H.sndN) Snd.sfx(kind);
  H.sndK = k; H.sndN = n;
}
function countdownSound(){
  const G = H.G;
  if(G && G.endsAt && ["answer","vote","fanswer","fvote"].includes(G.phase)){
    const sec = Math.ceil((G.endsAt-Date.now())/1000);
    if(sec>=1 && sec<=5 && sec!==H.lastSec){ H.lastSec = sec; Snd.sfx(sec<=3 ? "tockHi" : "tock"); }
  } else H.lastSec = 0;
}

/* ======================================================================
   HOST
   ====================================================================== */
const H = { nr:null, code:"", peers:[], G:null, hid:rid(), seq:0, pool:{prompts:[],finals:[]}, used:new Set(),
            spice:"clean", own:[], lastEmit:0, viewKey:"", colorOf:{}, qr:"", memo:{ans:{},vote:{}}, bots:[], botTimers:[], botUsed:new Set() };

function newGame(){ return { phase:"lobby", round:0, players:[], scores:{}, prompts:[], matches:[], mi:0, endsAt:0, rk:"", vk:"", reveal:null, final:null }; }
function basePrompts(){ const B = bank(); return H.spice==="cheeky" ? [...B.clean, ...B.cheeky] : [...B.clean]; }
function refillPool(){
  const own = shuffle(H.own.filter(t=>!H.used.has(t)));
  H.pool.prompts = [...own, ...shuffle(basePrompts().filter(t=>!own.includes(t)))];
  H.pool.finals = shuffle(bank().finals);
}

async function hostCreate(spice, own){
  if(busy) return;
  Snd.init();
  H.spice = spice === "cheeky" ? "cheeky" : "clean"; H.own = own||[];
  busy = true; renderHome();
  let code = "", nr = null, lastErr = null;
  for(let i=0;i<4 && !nr;i++){
    code = makeCode();
    try{ nr = await Net.host(code); }catch(e){ lastErr = e; if(!e || e.code!=="taken") break; }
  }
  busy = false;
  if(!nr) return renderHome(netError(lastErr && lastErr.code || "error"));
  leaveSession();
  H.nr = nr; H.code = code; H.qr = qrSvg(joinUrl(code)); screen = "game";
  H.nr.onPeers(ch=>{ H.peers = ch.peers; absorb(); progressSound(); if(ch.joined.length) emitState(); hostTick(); hostRender(false); });
  H.G = newGame();
  refillPool();
  try{ history.replaceState(null,"",location.pathname); }catch(e){}
  if(!H.started){
    H.started = true;
    window.addEventListener("beforeunload", e=>{ if(H.nr && H.G && H.G.phase!=="lobby" && H.G.phase!=="end"){ e.preventDefault(); e.returnValue=""; } });
    startTicker(hostTick);
  }
  Snd.startMusic(); Snd.phase("lobby");
  hostRender(true);
}

function takeFrom(key, n){
  const out=[]; let guard=0;
  while(out.length<n && guard++<400){
    if(!H.pool[key].length){ if(key==="prompts"){ H.pool.prompts = shuffle(basePrompts()); } else H.pool.finals = shuffle(bank().finals); }
    const t = H.pool[key].shift();
    if(H.used.has(t) && guard<200) continue;
    H.used.add(t); out.push(t);
  }
  return out;
}

/* ---------- AI players: answer from a pre-written bank, vote at random ---------- */
const AIB = window.ZINGERS_AI || { answers:{}, fallback:{en:[],nl:[]}, names:{en:[],nl:[]} };
function isBot(pid){ return typeof pid==="string" && pid.startsWith("ai-"); }
function humanCount(){ return lobbyPlayers().filter(p=>!isBot(p.pid)).length; }
function addBot(){
  if(lobbyPlayers().length >= 8) return;
  const taken = new Set(H.bots.map(b=>b.name));
  const pool = (AIB.names[lang()]||[]).concat(AIB.names.en||[]).filter(n=>!taken.has(n));
  const name = pool[0] || ("Bot "+(H.bots.length+1));
  const pid = "ai-"+rid().slice(0,8);
  H.colorOf[pid] = COLORS[Object.keys(H.colorOf).length % COLORS.length];
  H.bots.push({pid, name});
  Snd.sfx("join"); changed();
}
function removeBot(pid){ H.bots = H.bots.filter(b=>b.pid!==pid); changed(); }
function humanize(txt){
  let t2 = String(txt).trim();
  const r = Math.random();
  if(r < 0.45) t2 = t2.toLowerCase();
  else if(r < 0.7) t2 = t2.charAt(0).toLowerCase()+t2.slice(1);
  if(Math.random() < 0.5) t2 = t2.replace(/\.$/,"");
  return t2;
}
function botLine(promptText){
  let list = AIB.answers[promptText];
  if(!list || !list.length) list = AIB.fallback[lang()] || AIB.fallback.en || ["..."];
  const fresh = list.filter(a=>!H.botUsed.has(a));
  const pick = (fresh.length ? fresh : list)[Math.floor(Math.random()*(fresh.length ? fresh.length : list.length))];
  H.botUsed.add(pick);
  return humanize(pick).slice(0,60);
}
function botLater(ms, still, act){
  H.botTimers.push(setTimeout(()=>{ if(!H.G || !still()) return; act(); absorbTick(); }, ms));
}
function absorbTick(){ progressSound(); hostTick(); hostRender(false); }
function clearBots(){ H.botTimers.forEach(clearTimeout); H.botTimers = []; }
function runBots(kind){
  const G = H.G; if(!G) return;
  const bots = G.players.filter(p=>isBot(p.pid));
  const rand = (a,b)=>a+Math.random()*(b-a);
  for(const b of bots){
    if(kind==="answer"){
      const rk = G.rk; let at = rand(2500, 9000);
      for(const task of tasksOf(b.pid)){
        const tsk = task;
        botLater(at, ()=>G===H.G && G.phase==="answer" && G.rk===rk, ()=>{
          const k = b.pid+"|"+rk, m = H.memo.ans[k] || (H.memo.ans[k] = {});
          if(!m[tsk.id]) m[tsk.id] = botLine(tsk.t);
        });
        at += rand(2500, 8000);
      }
    } else if(kind==="vote"){
      const vk = G.vk, m = cur();
      if(!m || m.a===b.pid || m.b===b.pid) continue;
      botLater(rand(1500, 6000), ()=>G===H.G && G.phase==="vote" && G.vk===vk, ()=>{
        const k = b.pid+"|"+vk; if(!(k in H.memo.vote)) H.memo.vote[k] = Math.random()<.5 ? "x" : "y";
      });
    } else if(kind==="fanswer"){
      const fk = G.final.fk, ft = G.final.t;
      botLater(rand(4000, 15000), ()=>G===H.G && G.phase==="fanswer" && G.final.fk===fk, ()=>{
        const k = b.pid+"|"+fk, m = H.memo.ans[k] || (H.memo.ans[k] = {});
        if(!m.f) m.f = botLine(ft);
      });
    } else if(kind==="fvote"){
      const fk = G.final.fk, opts = G.final.opts.filter(o=>o.pid!==b.pid);
      if(!opts.length) continue;
      botLater(rand(2500, 9000), ()=>G===H.G && G.phase==="fvote" && G.final.fk===fk, ()=>{
        const k = b.pid+"|"+fk; if(!(k in H.memo.vote)) H.memo.vote[k] = opts[Math.floor(Math.random()*opts.length)].i;
      });
    }
  }
}

function lobbyPlayers(){
  const seen = new Map();
  for(const p of H.peers){
    const pr = p.presence||{};
    if(pr.role!=="player") continue;
    const pid = clean(pr.pid,24), name = clean(pr.name,16);
    if(!pid || !name || seen.has(pid)) continue;
    if(!H.colorOf[pid]) H.colorOf[pid] = COLORS[Object.keys(H.colorOf).length % COLORS.length];
    seen.set(pid,{pid,name});
  }
  return [...seen.values(), ...H.bots].slice(0,8);
}
function presOf(pid){
  let found = null;
  for(const p of H.peers){ const pr=p.presence||{}; if(pr.role==="player" && pr.pid===pid) found = pr; }
  return found;
}
function isOn(pid){ return isBot(pid) || !!presOf(pid); }
function nameOf(pid){ const p = H.G.players.find(x=>x.pid===pid); return p ? p.name : "?"; }
/* Answers and votes are kept here once received, so a phone that locks
   or drops its connection doesn't take its answers with it. */
function absorb(){
  for(const p of H.peers){
    const pr = p.presence||{};
    if(pr.role!=="player") continue;
    const pid = clean(pr.pid,24); if(!pid) continue;
    const a = pr.ans;
    if(a && typeof a.r==="string" && a.a && typeof a.a==="object"){
      const k = pid+"|"+a.r, m = H.memo.ans[k] || (H.memo.ans[k] = {});
      for(const [id,t] of Object.entries(a.a)){ const c = clean(t,60); if(c && !m[id]) m[id] = c; }
    }
    const v = pr.vote;
    if(v && typeof v.k==="string" && (typeof v.v==="string" || typeof v.v==="number")){
      const k = pid+"|"+v.k; if(!(k in H.memo.vote)) H.memo.vote[k] = v.v;
    }
  }
}
function ansOf(pid, key, id){
  const m = H.memo.ans[pid+"|"+key]; return (m && m[id]) || null;
}
function voteOf(pid, key){
  const k = pid+"|"+key; return (k in H.memo.vote) ? H.memo.vote[k] : null;
}

function changed(){ emitState(); hostRender(true); }
function setPhase(ph, ms){
  H.G.phase = ph; H.G.endsAt = ms ? Date.now()+ms : 0; changed(); H.sndK = ""; Snd.phase(ph, ph==="reveal" ? H.G.reveal : null);
  if(ph==="reveal" && H.G.reveal && H.G.reveal.zinger) confetti(90, 2800);
  if(ph==="freveal") confetti(70, 1400 + (H.G.final.res||[]).length*150 + 600);
  if(ph==="end") confetti(160, 300);
}

function startGame(){
  const G = H.G;
  G.players = lobbyPlayers().map(p=>({...p, color:H.colorOf[p.pid]}));
  if(G.players.length < 3 || !G.players.some(p=>!isBot(p.pid))) return;
  G.scores = Object.fromEntries(G.players.map(p=>[p.pid,0]));
  G.round = 1;
  setPhase("intro", T.intro);
}

function tasksOf(pid){ return H.G.prompts.filter(p=>p.a===pid||p.b===pid); }
function answeredCount(pid){ return tasksOf(pid).filter(p=>ansOf(pid,H.G.rk,p.id)).length; }

function beginAnswer(){
  const G = H.G;
  const ps = shuffle(G.players.map(p=>p.pid)), n = ps.length;
  const texts = takeFrom("prompts", n);
  G.rk = "r"+G.round+"-"+rid().slice(0,5); G.prev = {...G.scores};
  G.prompts = texts.map((t,i)=>({ id:"p"+i, t, a:ps[i], b:ps[(i+1)%n] }));
  setPhase("answer", T.answer); runBots("answer");
}
function allAnswered(){
  return H.G.players.every(p => !isOn(p.pid) || answeredCount(p.pid) >= tasksOf(p.pid).length);
}
function endAnswer(){
  const G = H.G;
  G.matches = G.prompts.map(p=>({ ...p, ta:ansOf(p.a,G.rk,p.id), tb:ansOf(p.b,G.rk,p.id), swap:Math.random()<.5 }))
                       .filter(m=>m.ta||m.tb);
  G.matches = shuffle(G.matches);
  G.mi = 0;
  if(!G.matches.length) return setPhase("scores", T.scores);
  startVote();
}
function cur(){ return H.G.matches[H.G.mi]; }
function side(m, s){ const leftIsA = !m.swap; const isA = (s==="x") === leftIsA; return { pid: isA?m.a:m.b, text: isA?m.ta:m.tb }; }
function voters(m){ return H.G.players.filter(p=>p.pid!==m.a && p.pid!==m.b && isOn(p.pid)); }
function startVote(){
  const G = H.G, m = cur();
  G.vk = G.rk+"-m"+G.mi;
  if(!m.ta || !m.tb) return doReveal();
  setPhase("vote", T.vote); runBots("vote");
}
function votedPids(){ const m=cur(); return voters(m).filter(p=>{ const v=voteOf(p.pid,H.G.vk); return v==="x"||v==="y"; }).map(p=>p.pid); }
function allVoted(){ const m=cur(); return votedPids().length >= voters(m).length; }
function doReveal(){
  const G = H.G, m = cur(), mult = G.round;
  const X = side(m,"x"), Y = side(m,"y");
  const vx=[], vy=[];
  if(m.ta && m.tb){
    for(const p of G.players){ if(p.pid===m.a||p.pid===m.b) continue; const v=voteOf(p.pid,G.vk); if(v==="x") vx.push(p.name); else if(v==="y") vy.push(p.name); }
  }
  let px = vx.length*100*mult, py = vy.length*100*mult, zinger=null, forfeit=false;
  if(!X.text || !Y.text){ forfeit = true; if(X.text) px = 250*mult; if(Y.text) py = 250*mult; }
  else {
    if(vx.length>vy.length) px += 100*mult; else if(vy.length>vx.length) py += 100*mult;
    const total = vx.length+vy.length;
    if(total>=2 && (vx.length===total || vy.length===total)){ zinger = vx.length ? "x" : "y"; if(zinger==="x") px += 200*mult; else py += 200*mult; }
  }
  if(X.text) G.scores[X.pid] = (G.scores[X.pid]||0)+px;
  if(Y.text) G.scores[Y.pid] = (G.scores[Y.pid]||0)+py;
  G.reveal = { x:{...X, votes:vx, pts:X.text?px:0}, y:{...Y, votes:vy, pts:Y.text?py:0}, zinger, forfeit };
  setPhase("reveal", T.reveal);
}
function nextMatch(){
  const G = H.G; G.reveal = null; G.mi++;
  if(G.mi < G.matches.length) startVote(); else setPhase("scores", T.scores);
}
function afterScores(){
  const G = H.G;
  if(G.round < 2){ G.round++; setPhase("intro", T.intro); }
  else if(G.round === 2){ G.round = 3; setPhase("fintro", T.intro); }
  else setPhase("end", 0);
}
function beginFinal(){
  const G = H.G;
  G.final = { t: takeFrom("finals",1)[0], fk:"f-"+rid().slice(0,6), opts:[], res:null }; G.prev = {...G.scores};
  setPhase("fanswer", T.fanswer); runBots("fanswer");
}
function allFinalAnswered(){ const G=H.G; return G.players.every(p=>!isOn(p.pid) || ansOf(p.pid,G.final.fk,"f")); }
function endFinalAnswer(){
  const G = H.G;
  G.final.opts = shuffle(G.players.map(p=>({pid:p.pid, t:ansOf(p.pid,G.final.fk,"f")})).filter(o=>o.t)).map((o,i)=>({...o,i}));
  if(G.final.opts.length < 2) return setPhase("end",0);
  setPhase("fvote", T.fvote); runBots("fvote");
}
function finalVote(pid){
  const G=H.G, v = voteOf(pid,G.final.fk);
  const o = G.final.opts.find(o=>o.i===v);
  return (o && o.pid!==pid) ? o : null;
}
function finalVoters(){ const G=H.G; return G.players.filter(p=>isOn(p.pid) && G.final.opts.some(o=>o.pid!==p.pid)); }
function allFinalVoted(){ return finalVoters().every(p=>finalVote(p.pid)); }
function finalReveal(){
  const G = H.G;
  const tally = new Map(G.final.opts.map(o=>[o.i,[]]));
  for(const p of G.players){ const o = finalVote(p.pid); if(o) tally.get(o.i).push(p.name); }
  const top = Math.max(0,...[...tally.values()].map(v=>v.length));
  G.final.res = G.final.opts.map(o=>{
    const v = tally.get(o.i); let pts = v.length*300; const best = top>0 && v.length===top;
    if(best) pts += 300;
    G.scores[o.pid] = (G.scores[o.pid]||0)+pts;
    return {...o, votes:v, pts, best};
  });
  setPhase("freveal", T.freveal);
}
function playAgain(){
  const keepColors = H.colorOf;
  clearBots(); H.G = newGame(); H.colorOf = keepColors; H.memo = {ans:{},vote:{}}; H.botUsed = new Set();
  changed();
}

function hostTick(){
  const G = H.G; if(!G) return;
  const now = Date.now(), up = G.endsAt && now >= G.endsAt;
  switch(G.phase){
    case "intro": if(up) beginAnswer(); break;
    case "answer": if(up || allAnswered()) endAnswer(); break;
    case "vote": if(up || allVoted()) doReveal(); break;
    case "reveal": if(up) nextMatch(); break;
    case "scores": if(up) afterScores(); break;
    case "fintro": if(up) beginFinal(); break;
    case "fanswer": if(up || allFinalAnswered()) endFinalAnswer(); break;
    case "fvote": if(up || allFinalVoted()) finalReveal(); break;
    case "freveal": if(up) setPhase("end",0); break;
  }
  updateTimer(G.endsAt ? G.endsAt-Date.now() : 0);
  countdownSound();
  if(now - H.lastEmit > 1500) emitState();
}

function publicState(){
  const G = H.G;
  const s = { hid:H.hid, seq:++H.seq, lg:lang(), ph:G.phase, rd:G.round, rem: G.endsAt ? Math.max(0,G.endsAt-Date.now()) : 0 };
  const pl = G.phase==="lobby" ? lobbyPlayers() : G.players;
  s.pl = pl.map(p=>[p.pid, p.name, H.colorOf[p.pid]||COLORS[0]]);
  if(G.phase==="answer"){ s.rk = G.rk; s.pr = G.prompts.map(p=>[p.id,p.t,p.a,p.b]); s.dn = G.players.filter(p=>answeredCount(p.pid)>=tasksOf(p.pid).length).map(p=>p.pid); }
  if((G.phase==="vote"||G.phase==="reveal") && cur()){ const m=cur(); s.m = { k:G.vk, t:m.t, x:side(m,"x").text, y:side(m,"y").text, au:[m.a,m.b] }; }
  if(G.phase==="fanswer"){ s.fk = G.final.fk; s.ft = G.final.t; s.dn = G.players.filter(p=>ansOf(p.pid,G.final.fk,"f")).map(p=>p.pid); }
  if(G.phase==="fvote"){ s.fk = G.final.fk; s.ft = G.final.t; s.fo = G.final.opts.map(o=>[o.i,o.t,o.pid]); }
  if(["scores","freveal","end","reveal"].includes(G.phase)) s.sc = G.scores;
  return s;
}

function updateTimer(ms){

function hostKey(){
  const G = H.G; let prog = "";
  if(G.phase==="lobby") prog = lobbyPlayers().map(p=>p.pid+p.name).join(",");
  else if(G.phase==="answer") prog = G.players.map(p=>answeredCount(p.pid)).join("");

  else if(G.phase==="fanswer") prog = G.players.map(p=>ansOf(p.pid,G.final.fk,"f")?1:0).join("");
  else if(G.phase==="fvote") prog = G.players.map(p=>finalVote(p.pid)?1:0).join("");
  const on = G.players.map(p=>isOn(p.pid)?1:0).join("");

/* Scoreboard. With "prev" (scores before this round) it first shows the old order,
   then every name tag slides to its new place while the points count up. */
function board(prev){
  const G = H.G, key = [G.phase, G.round, G.rk, G.final ? G.final.fk : ""].join("|");
  const still = !prev || H.boardDone===key || (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  if(still) return boardList(ranked(G.scores), G.scores);
  const ol = boardList(ranked(prev), prev);
  setTimeout(()=>shuffleBoard(ol, prev, G.scores, key), 1300);
  return ol;
}
function shuffleBoard(ol, prev, now, key){
  if(!ol.isConnected || !H.G) return;
  H.boardDone = key;
  const rows = ranked(now), items = new Map([...ol.children].map(li=>[li.dataset.pid, li]));
  const before = new Map([...items].map(([pid,li])=>[pid, li.getBoundingClientRect().top]));
  rows.forEach(p=>{ const li = items.get(p.pid); if(li) ol.appendChild(li); });
  let moved = false;
  rows.forEach((p,i)=>{
    const li = items.get(p.pid); if(!li) return;
    const dy = before.get(p.pid) - li.getBoundingClientRect().top;
    li.style.transition = "none"; li.style.transform = "translateY("+dy+"px)";
    if(dy > 4){ li.classList.add("up"); moved = true; } else if(dy < -4) moved = true;
    li.querySelector(".rank").textContent = String(i+1);
    const gain = (now[p.pid]||0) - (prev[p.pid]||0);
    if(gain > 0) li.querySelector(".sc").before(h("span",{class:"gain"},"+"+gain));
  });
  ol.getBoundingClientRect();
  const D = 1800;
  requestAnimationFrame(()=>items.forEach(li=>{ li.style.transition = "transform "+D+"ms cubic-bezier(.45,0,.15,1)"; li.style.transform = ""; }));
  setTimeout(()=>items.forEach(li=>li.classList.remove("up")), D+200);
  if(moved) Snd.sfx("whoosh");
  const t0 = performance.now();
  const step = tm=>{
    const k = Math.min(1, (tm-t0)/D), e = 1-Math.pow(1-k, 3);
    items.forEach((li,pid)=>{ const a = prev[pid]||0, b = now[pid]||0; li.querySelector(".sc").textContent = String(Math.round(a+(b-a)*e)); });
    if(k < 1 && ol.isConnected) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

const P = { nr:null, code:"", pid:"", name:"", st:null, hid:null, seq:0, localEnd:0, lastSeen:0, viewKey:"", ans:{r:"",a:{}}, voted:"", link:"up" };

async function playerJoin(code, name){
  if(busy) return;
  if(P.nr && code===P.code) return backToGame();
  let pid = tabStore.get("zing-pid"); if(!pid){ pid = rid(); tabStore.set("zing-pid",pid); }
  store.set("zing-name",name); store.set("zing-code",code);
  busy = true; renderHome();
  let nr = null;
  try{ nr = await Net.join(code, s=>{ if(P.nr===nr){ P.link = s; playerTick(); } }); }
  catch(e){ busy = false; return renderHome(netError(e && e.code || "error")); }
  busy = false;
  leaveSession();
  P.nr = nr; P.code = code; P.name = name; P.pid = pid; screen = "game";
  try{ const saved = JSON.parse(tabStore.get("zing-state")||"null"); if(saved && saved.code===code){ P.ans = saved.ans||P.ans; P.voted = saved.voted||""; P.lastVote = saved.lastVote||null; } }catch(e){}
  P.nr.presence(P.lastVote ? {role:"player", pid, name, ans:P.ans, vote:P.lastVote} : {role:"player", pid, name, ans:P.ans});
  P.nr.on("state", msg=>{ if(msg.sameTab) return; onState(msg.data); });
  if(!P.ticking){ P.ticking = true; setInterval(playerTick, 250); }
  playerRender(true);
}
function onState(d){
  if(!d || typeof d!=="object" || typeof d.hid!=="string") return;
  if(d.hid !== P.hid){ P.hid = d.hid; P.seq = 0; }
  if(typeof d.seq!=="number" || d.seq <= P.seq) return;
  P.seq = d.seq; P.st = d; P.lastSeen = Date.now();
  P.localEnd = d.rem ? Date.now()+Number(d.rem) : 0;
  try{ trPrefetch(); }catch(e){}
  playerRender(false);
}
function playerTick(){
  const tEl = document.getElementById("ptimer");
  if(tEl){ const ms = P.localEnd - Date.now(); const s = ms>0 ? String(Math.ceil(ms/1000)) : ""; if(tEl.textContent!==s) tEl.textContent = s;
    tEl.classList.toggle("hurry", ms>0 && ms<=5500 && !!P.st && ["answer","vote","fanswer","fvote"].includes(P.st.ph)); }
  const l = document.getElementById("lost");
  if(l){ const msg = (P.link==="down" || (P.st && Date.now()-P.lastSeen > 8000)) ? t("lost") : ""; if(l.textContent!==msg) l.textContent = msg; }
}
function me(){ const s=P.st; return s && Array.isArray(s.pl) ? s.pl.find(p=>p[0]===P.pid) : null; }
function myTasks(){ const s=P.st; return (Array.isArray(s.pr)?s.pr:[]).filter(p=>p[2]===P.pid||p[3]===P.pid); }
function nextTask(){ const s=P.st; return myTasks().find(p=>!(P.ans.r===s.rk && P.ans.a[p[0]])); }
function submitAns(key, id, text){
  text = clean(text,60); if(!text) return;
  if(P.ans.r !== key) P.ans = { r:key, a:{} };
  P.ans.a[id] = text;
  P.nr.presence({ ans: P.ans }); saveP();
  playerRender(true);

const TRP = new Map(), TRD = new Map();

async function gtx(text, sl, tl){
  const ctl = new AbortController(), tm = setTimeout(()=>ctl.abort(), 4000);

    const r = await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl="+sl+"&tl="+tl+"&q="+encodeURIComponent(text), {signal:ctl.signal});
    if(!r.ok) throw new Error("tr "+r.status);
    const j = await r.json(), out = (Array.isArray(j[0]) ? j[0] : []).map(x=>x && x[0] || "").join("").trim();
    if(!out) throw new Error("tr empty");

  } finally { clearTimeout(tm); }
}
async function myMemory(text, sl, tl){
  const ctl = new AbortController(), tm = setTimeout(()=>ctl.abort(), 4000);
  try{
    const r = await fetch("https://api.mymemory.translated.net/get?langpair="+(sl==="auto" ? (tl==="nl" ? "en" : "nl") : sl)+"|"+tl+"&q="+encodeURIComponent(text), {signal:ctl.signal});
    const j = await r.json(), out = j && j.responseData && String(j.responseData.translatedText||"").trim();
    if(!out || j.responseStatus!==200) throw new Error("tr mm");
    return { t: out, d: sl };
  } finally { clearTimeout(tm); }
}
function translate(text, sl, tl){
  const k = sl+">"+tl+"|"+text;
  if(!TRP.has(k)) TRP.set(k, gtx(text, sl, tl).catch(()=>myMemory(text, sl, tl)).catch(()=>null));
  return TRP.get(k);
}
/* Fill an element with the text, translated for this player when needed (original shown small underneath). */
function trFill(el, text){
  text = String(text||""); el.textContent = "";
  if(!text || !trOn()){ el.textContent = text; return el; }
  const sl = P.st.lg, tl = lang(), k = sl+">"+tl+"|"+text, got = TRD.get(k);
  el.dataset.trk = k;
  el.append(h("span",{class:"trm"}, got || text));
  if(got && got.toLowerCase()!==text.toLowerCase()) el.append(h("span",{class:"tro",lang:sl}, text));
  if(got===undefined){
    TRD.set(k, null);
    translate(text, sl, tl).then(r=>{
      TRD.set(k, r ? r.t : text);
      app.querySelectorAll("[data-trk]").forEach(e=>{ if(e.dataset.trk===k) trFill(e, text); });
    });
  }
  return el;
}
function trBox(tag, attrs, text){ return trFill(h(tag, attrs), text); }
/* Warm the cache as soon as new text arrives, so it is usually ready before the screen needs it. */
function trPrefetch(){
  if(!trOn()) return;
  const s = P.st, sl = s.lg, tl = lang(), want = [];
  if(s.ph==="answer") myTasks().forEach(p=>want.push(p[1]));
  if((s.ph==="vote"||s.ph==="reveal") && s.m) want.push(s.m.t, s.m.x, s.m.y);
  if(s.ph==="fanswer"||s.ph==="fvote") want.push(s.ft);
  if(s.ph==="fvote" && Array.isArray(s.fo)) s.fo.forEach(o=>want.push(o[1]));
  want.filter(Boolean).forEach(x=>{ const k = sl+">"+tl+"|"+x; if(!TRD.has(k)){ TRD.set(k, null); translate(x, sl, tl).then(r=>{ TRD.set(k, r ? r.t : x); app.querySelectorAll("[data-trk]").forEach(e=>{ if(e.dataset.trk===k) trFill(e, x); }); }); } });
}
/* Answers go out in the host's language. Falls back to the typed text if translation is slow or fails. */
async function toGameLang(text){
  if(!trOn()) return text;
  const gl = P.st.lg;
  const r = await Promise.race([translate(text, "auto", gl), new Promise(res=>setTimeout(()=>res(null), 5000))]);
  if(!r || r.d===gl) return text;
  return clean(r.t, 60) || text;
}

function playerKey(){
  const s = P.st; if(!s) return "wait";
  const k = [s.hid, s.ph, s.rd, me()?1:0];
  if(s.ph==="answer"){ const t = nextTask(); k.push(s.rk, t ? t[0] : "done"); }
  if(s.ph==="vote"||s.ph==="reveal") k.push(s.m && s.m.k, P.voted===(s.m&&s.m.k) ? 1:0);
  if(s.ph==="fanswer") k.push(s.fk, (P.ans.r===s.fk && P.ans.a.f) ? 1:0);
  if(s.ph==="fvote") k.push(s.fk, P.voted===s.fk ? 1:0);
  if(s.sc) k.push(JSON.stringify(s.sc));
  const waiting = (s.ph==="answer" && !nextTask()) || (s.ph==="fanswer" && P.ans.r===s.fk && P.ans.a.f);
  if(waiting && Array.isArray(s.dn)) k.push(s.dn.join(","));
  if(s.ph==="lobby") k.push((s.pl||[]).length);
  k.push(lang());
  return k.join("|");
}
function playerRender(force){
  if(screen!=="game" || !P.nr) return;
  const k = playerKey(); if(!force && k===P.viewKey) return;
  P.viewKey = k; mount(playerView()); playerTick();
  const s = P.st, tk = s && s.ph==="answer" ? nextTask() : null;
  const ak = s ? [s.hid, s.ph, s.rd, tk ? tk[0] : "", s.m && s.m.k, P.voted, s.fk, !!me()].join("|") : "wait";
  if(ak !== P.animKey){ P.animKey = ak; enter(".pstage"); }
  const f = app.querySelector("input,.pick"); if(f && f.tagName==="INPUT"){ f.focus(); try{ f.setSelectionRange(f.value.length, f.value.length); }catch(e){} }
}
function answerForm(key, id, promptText, label){
  const dk = key+"|"+id;
  const inp = h("input",{maxlength:"60",autocomplete:"off",enterkeyhint:"send","aria-label":t("yourAnswer"),placeholder:t("yourAnswer"),value:(P.draft&&P.draft.k===dk)?P.draft.v:""});
  inp.addEventListener("input",()=>{ P.draft = {k:dk, v:inp.value}; });
  const btn = h("button",{class:"primary big"},t("send"));
  const send = async ()=>{
    const typed = clean(inp.value, 60); if(!typed || P.sending===dk) return;
    let out = typed;
    if(trOn()){
      P.sending = dk; btn.disabled = true; inp.disabled = true; btn.textContent = t("translating");
      try{ out = await toGameLang(typed); }catch(e){ out = typed; }
      P.sending = null;
      P.sent = out.toLowerCase()!==typed.toLowerCase() ? { k:key, t:out } : null;
    }
    P.draft = null; submitAns(key,id,out);
  };
  btn.addEventListener("click", send);
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); send(); } });
  return [ label ? h("p",{class:"count muted"},label) : null, sentLine(key), trBox("div",{class:"pprompt"},promptText), inp, btn ];
}
function sentLine(key){ return (P.sent && P.sent.k===key) ? h("p",{class:"muted sent"}, t("sentAs", P.sent.t)) : null; }
function waitingLine(){
  const s = P.st, dn = Array.isArray(s.dn) ? s.dn : null;
  const left = dn ? (s.pl||[]).filter(p=>p[0]!==P.pid && !dn.includes(p[0])).map(p=>p[1]) : [];
  const txt = left.length ? t("waitingFor", left.join(", ")) : t("allIn");
  return [sentLine(s.ph==="fanswer" ? s.fk : s.rk), h("p",{class:"muted"},txt), h("p",{class:"muted",style:"font-size:.9rem"},t("savedNote"))];
}
function myScoreLine(){
  const s=P.st; if(!s.sc) return null;
  const rows = Object.entries(s.sc).sort((a,b)=>b[1]-a[1]);
  const i = rows.findIndex(r=>r[0]===P.pid); if(i<0) return null;
  return h("p",{class:"lead"}, t("scoreLine", i+1, rows[i][1]));
}
function playerView(){
  const s = P.st, m = me();
  const color = m ? m[2] : "var(--line)";
  const bar = h("div",{class:"pbar"}, h("button",{class:"logo linklike",onclick:goHome,"aria-label":t("logoAria")},"Zingers"), h("span",{class:"me",style:"--c:"+color}, P.name), h("span",{class:"muted"},t("room")+" "+P.code), h("span",{id:"ptimer",class:"timer"}), langButton());
  let body;
  if(!s) body = [h("h2",{},t("inRoom")), h("p",{class:"muted"},t("waitHost"))];
  else if(!m && s.ph!=="lobby") body = [h("h2",{},t("running")), h("p",{class:"muted"},t("nextOne"))];
  else switch(s.ph){
    case "lobby": body = [h("h2",{}, m ? t("youreIn") : t("joining")), h("p",{class:"muted"}, m ? t("lobbyCount", (s.pl||[]).length) : t("roomFull"))]; break;
    case "intro": body = [h("h2",{},t("round", s.rd)), h("p",{class:"muted"},t("promptsIncoming"))]; break;
    case "fintro": body = [h("h2",{},t("theFinal")), h("p",{class:"muted"},t("oneFinal"))]; break;
    case "answer": {
      const tk = nextTask(), all = myTasks();
      body = tk ? answerForm(s.rk, tk[0], tk[1], all.length>1 ? t("promptXofY", all.indexOf(tk)+1, all.length) : "")
               : [h("h2",{},t("answersIn")), waitingLine()];
      break;
    }
    case "vote": {
      const mm = s.m || {};
      if(Array.isArray(mm.au) && mm.au.includes(P.pid)) body = [h("h2",{},t("yourMatch")), h("p",{class:"muted"},t("noVoteHere"))];
      else if(P.voted===mm.k) body = [h("h2",{},t("voteIn")), h("p",{class:"muted"},t("eyesScreen"))];
      else body = [trBox("div",{class:"pprompt"}, mm.t), h("p",{class:"muted"},t("funnier")),
        trBox("button",{class:"pick x",onclick:()=>castVote(mm.k,"x")}, mm.x),
        trBox("button",{class:"pick y",onclick:()=>castVote(mm.k,"y")}, mm.y)];
      break;
    }
    case "fanswer":
      body = (P.ans.r===s.fk && P.ans.a.f) ? [h("h2",{},t("answerIn")), waitingLine()] : answerForm(s.fk, "f", s.ft, t("finalPrompt"));
      break;
    case "fvote": {
      const opts = (Array.isArray(s.fo)?s.fo:[]).filter(o=>o[2]!==P.pid);
      body = P.voted===s.fk ? [h("h2",{},t("voteIn")), h("p",{class:"muted"},t("eyesScreen"))]
        : [trBox("div",{class:"pprompt"}, s.ft), h("p",{class:"muted"},t("pickFav")),
           opts.map((o,i)=>trBox("button",{class:"pick "+(i%2?"y":"x"),onclick:()=>castVote(s.fk,o[0])}, o[1]))];
      break;
    }
    case "end": body = [h("h2",{},t("gameOver")), myScoreLine(), h("p",{class:"muted"},t("stayHere"))]; break;
    default: body = [h("h2",{},t("eyesScreenH")), myScoreLine()];
  }
  return h("main",{class:"player"}, bar, h("p",{id:"lost",class:"lost",role:"status"}), h("section",{class:"pstage"}, body));
}

/* ---------- boot ---------- */
renderHome();
})();
</script>
